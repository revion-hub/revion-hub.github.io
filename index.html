<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revion Hub</title>
    <style>
        :root {
            --bg: #0b0d10;
            --bg-card: #16181d;
            --bg-card-hover: #1e2128;
            --bg-nav: #0f1115;
            --border: #262a31;
            --text: #f2f4f7;
            --text-dim: #9aa3af;
            --accent: #4f8cff;
            --accent-hover: #6ba0ff;
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---------- Navbar ---------- */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        .navbar-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
            cursor: pointer;
            color: var(--text);
            text-decoration: none;
        }

        .logo-badge {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: linear-gradient(135deg, #4f8cff, #7b5cff);
            display: grid;
            place-items: center;
            font-size: 16px;
            font-weight: 900;
            color: #fff;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 8px 14px;
            border-radius: 8px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.15s;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--text);
            background: var(--bg-card);
        }

        /* ---------- Sections ---------- */
        .page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page.hidden {
            display: none;
        }

        /* ---------- Hero ---------- */
        .hero {
            text-align: center;
            padding: 80px 20px 60px;
        }

        .hero h1 {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.05;
            margin-bottom: 16px;
            background: linear-gradient(120deg, #ffffff, #9ec1ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            color: var(--text-dim);
            font-size: 18px;
            max-width: 560px;
            margin: 0 auto 40px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ---------- Buttons ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: 0.18s;
            color: #fff;
        }

        .btn-primary {
            background: var(--accent);
            box-shadow: 0 6px 24px rgba(79, 140, 255, 0.25);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(79, 140, 255, 0.35);
        }

        .btn-secondary {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: var(--bg-card-hover);
            border-color: #3a3f48;
            transform: translateY(-2px);
        }

        .btn svg {
            width: 18px;
            height: 18px;
        }

        /* ---------- Section headers ---------- */
        .section-head {
            margin-bottom: 28px;
        }

        .section-head h2 {
            font-size: 28px;
            font-weight: 800;
        }

        .section-head p {
            color: var(--text-dim);
            margin-top: 6px;
        }

        /* ---------- Games grid ---------- */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            cursor: pointer;
            transition: 0.18s;
            text-align: left;
        }

        .game-card:hover {
            background: var(--bg-card-hover);
            border-color: #3a3f48;
            transform: translateY(-3px);
        }

        .game-icon {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 10px;
            background: #22252c;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .game-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .game-name {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .game-meta {
            color: var(--text-dim);
            font-size: 13px;
        }

        /* ---------- Modal ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 24px;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 640px;
            width: 100%;
            overflow: hidden;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background: #22252c;
        }

        .modal-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-body h3 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-body p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-close {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .modal-close:hover {
            color: var(--text);
            background: var(--bg-card-hover);
        }

        /* ---------- Footer ---------- */
        .footer {
            border-top: 1px solid var(--border);
            background: var(--bg-nav);
            padding: 24px;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="logo" href="#home">
                <span class="logo-badge">R</span>
                Revion Hub
            </a>
            <div class="nav-links">
                <a class="nav-link active" href="#home">Home</a>
                <a class="nav-link" href="#games">Games</a>
            </div>
        </div>
    </nav>

    <!-- Home page -->
    <section class="page" id="home">
        <div class="hero">
            <h1>Revion Hub</h1>
            <p>Your gateway to the best Roblox experiences. Discover games, join the community, and start playing in seconds.</p>
            <div class="hero-buttons">
                <a class="btn btn-primary" href="#games">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" stroke-linejoin="round"/></svg>
                    Explore Games
                </a>
                <a class="btn btn-secondary" href="https://revion.lol/discord" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.27 5.33C17.94 4.71 16.5 4.26 15 4a.09.09 0 0 0-.07.03c-.18.33-.39.76-.53 1.09a16.09 16.09 0 0 0-4.8 0c-.14-.34-.35-.76-.54-1.09a.09.09 0 0 0-.07-.03c-1.5.26-2.94.71-4.27 1.33-.03.01-.04.03-.05.06C.7 9.63.14 13.78.5 17.88c0 .03.02.05.04.07 1.83 1.35 3.6 2.17 5.34 2.71.03.01.06 0 .08-.03.36-.49.68-1.01.95-1.56.02-.04 0-.08-.03-.1-.51-.19-1-.42-1.46-.68-.04-.02-.04-.07-.01-.1.1-.07.2-.14.29-.21.03-.02.07-.02.1 0a11.8 11.8 0 0 0 10.02 0 .08.08 0 0 1 .1 0c.1.07.2.14.29.21.03.03.03.08-.01.1-.46.26-.95.49-1.46.68-.04.02-.05.06-.03.1.27.55.59 1.07.95 1.56a.08.08 0 0 0 .08.03c1.74-.54 3.51-1.36 5.34-2.71a.08.08 0 0 0 .04-.07c.4-4.73-.57-8.85-2.38-12.49a.06.06 0 0 0-.05-.06zM8.5 15.33c-.96 0-1.75-.88-1.75-1.96s.78-1.96 1.75-1.96c.97 0 1.75.88 1.75 1.96s-.78 1.96-1.75 1.96zm7 0c-.96 0-1.75-.88-1.75-1.96s.78-1.96 1.75-1.96c.97 0 1.75.88 1.75 1.96s-.78 1.96-1.75 1.96z"/></svg>
                    Join Discord
                </a>
            </div>
        </div>
    </section>

    <!-- Games page -->
    <section class="page hidden" id="games">
        <div class="section-head">
            <h2>Explore Games</h2>
            <p>Click a game to view details and play.</p>
        </div>
        <div class="games-grid" id="gamesGrid"></div>
    </section>

    <!-- Game modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-thumb">
                <img id="modalThumb" src="" alt="">
            </div>
            <div class="modal-body">
                <h3 id="modalTitle"></h3>
                <p id="modalDesc"></p>
                <div class="modal-actions">
                    <a class="btn btn-primary" id="modalPlay" href="#" target="_blank" rel="noopener noreferrer">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        Play
                    </a>
                    <button class="modal-close" id="modalClose">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        Revion Hub &copy; 2026 &nbsp;&middot;&nbsp; <a href="https://revion.lol/discord" target="_blank" rel="noopener noreferrer">Discord</a>
    </div>

    <script>
        // ============================================================
        //  CONFIGURE YOUR GAMES HERE
        //  Add as many objects as you want inside the games array.
        // ============================================================
        const games = [
            {
                "name": "A Quiet Place",
                "thumb": "https://tr.rbxcdn.com/180DAY-9237e45cd0253e11e4547ecedd939498/768/432/Image/Webp/noFilter",
                "icon": "https://tr.rbxcdn.com/180DAY-d32c2a7431d4f1e920e2c9f43748641c/256/256/Image/Webp/noFilter",
                "desc": `Store
Servers
Description
The earth has been overrun by deadly extraterrestrial creatures. Using their unimaginably good hearing, these aliens are able to hunt down and silence anyone and anything that makes noise. The United States Government has designated the entirety of the Northeastern United States as a deadzone, where no one has been able to establish contact. In your hometown of Cold Spring, New York, your only hope of survival is to stay silent. 

During this phase, everything that is currently in-game is subject to change. Any gamepasses or products that currently exist are not necessarily permanent. Purchase at your own risk (Expect accomodations of some kind).

Bugs are to be expected. Please report any that you find so we can fix them.

Note: Leaving while in danger (⚠️ indicator in-game) will cause you to lose your saved session.

Use Code: 50KLIKES
New Code at 100K LIKES!`,
                "link": "https://www.roblox.com/games/106920577206536"
            },
        ];

        // ============================================================
        //  PAGE NAVIGATION (hash-based)
        // ============================================================
        const pages = document.querySelectorAll('.page');
        const navLinks = document.querySelectorAll('.nav-link');

        function showPage(hash) {
            const target = hash === '#games' ? '#games' : '#home';
            pages.forEach(p => p.classList.toggle('hidden', p.id !== target.slice(1)));
            navLinks.forEach(l => l.classList.toggle('active', l.getAttribute('href') === target));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.addEventListener('hashchange', () => showPage(window.location.hash));
        showPage(window.location.hash || '#home');

        // ============================================================
        //  RENDER GAMES GRID
        // ============================================================
        const grid = document.getElementById('gamesGrid');

        games.forEach((game, index) => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-icon">
                    <img src="${game.icon}" alt="${game.name}" onerror="this.style.display='none'; this.parentElement.style.background='#2a2e36'">
                </div>
                <div class="game-name">${game.name}</div>
                <div class="game-meta">Click to view</div>
            `;
            card.addEventListener('click', () => openModal(index));
            grid.appendChild(card);
        });

        // ============================================================
        //  MODAL
        // ============================================================
        const overlay = document.getElementById('modalOverlay');
        const modalThumb = document.getElementById('modalThumb');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const modalPlay = document.getElementById('modalPlay');

        function openModal(index) {
            const game = games[index];
            modalThumb.src = game.thumb;
            modalThumb.onerror = () => { modalThumb.style.display = 'none'; };
            modalTitle.textContent = game.name;
            modalDesc.textContent = game.desc;
            modalPlay.href = game.link;
            overlay.classList.add('open');
        }

        function closeModal() {
            overlay.classList.remove('open');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
